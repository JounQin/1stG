<!doctype html>
<html lang="en">
  <head>
    <title>轮子主义初级阶段 v0.0.1 - Write Less, Think More</title>
    <meta charset="UTF-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <meta
      name="description"
      content="轮子主义初级阶段 v0.0.1 - Write Less, Think More"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <script>
      ;(function () {
        var docEl = document.documentElement
        var canvas = document.createElement('canvas')
        canvas.width = canvas.height = 1
        if (
          canvas.toDataURL &&
          canvas.toDataURL('image/webp').indexOf('image/webp') === 5
        ) {
          docEl.classList.add('webp')
        }
        docEl.style.fontSize =
          docEl.offsetWidth < 900 || docEl.offsetHeight < 600
            ? Math.min(docEl.offsetWidth / 900, docEl.offsetHeight / 600) *
                100 +
              'px'
            : null
      })()
    </script>
    <style>
      #skip a {
        position: absolute;
        left: -10000px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      #skip a:focus {
        position: static;
        width: auto;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="skip"><a href="#app">skip to content</a></div>
    <div id="app"><!--app-html--></div>
    <script
      type="module"
      src="/src/entry-client.tsx"
    ></script>
  </body>
</html>
