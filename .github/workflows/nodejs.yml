name: Node CI

on:
  - push
  - pull_request

jobs:
  default:
    strategy:
      matrix:
        node:
          - lts/*
        os:
          - macOS-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      # packageManager pins Yarn 4, and the Yarn bundled with setup-node is 1.x, which refuses to run
      # once that field names a different major. Corepack's shims make a plain `yarn` resolve to the
      # pinned version, so the commands below need no prefix.
      - run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build, Lint
        run: |
          yarn lint
          yarn build
