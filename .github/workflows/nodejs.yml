name: Node CI

on:
  - push
  - pull_request

jobs:
  default:
    strategy:
      matrix:
        node:
          - 18
        os:
          - macOS-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # packageManager pins Yarn 4, and the Yarn bundled with setup-node is 1.x, which refuses to run
      # at all once that field names a different major. Going through Corepack needs no install step
      # for Yarn itself and no write access to the Node directory, unlike `corepack enable`.
      - name: Install Dependencies
        run: corepack yarn install --immutable

      - name: Build, Lint
        run: |
          corepack yarn lint
          corepack yarn build
        env:
          EFF_NO_LINK_RULES: 'true'
          PARSER_NO_WATCH: 'true'
