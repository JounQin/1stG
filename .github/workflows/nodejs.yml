name: Node CI

on:
  - push
  - pull_request

jobs:
  default:
    strategy:
      matrix:
        node:
          - 24
        os:
          - macOS-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # packageManager pins Yarn 4, and the Yarn bundled with setup-node is 1.x, which refuses to run
      # once that field names a different major. Corepack's shims make a plain `yarn` resolve to the
      # pinned version, so the commands below need no prefix.
      - run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build, Lint
        run: |
          yarn lint
          yarn build
